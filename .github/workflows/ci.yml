name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Dependency audit
        run: pip-audit -r requirements.txt || true

      - name: Unit and API tests (offline)
        run: PYTHONPATH=. pytest tests/ -m "not network and not slow" -v --tb=short

      - name: TTS integration test
        run: PYTHONPATH=. pytest tests/ -m network -v

      - name: ASR smoke test
        run: PYTHONPATH=. pytest tests/ -m slow -v
